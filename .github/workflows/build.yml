name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: .\build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: ForcedUpscaling
          path: bin/ForcedUpscaling.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bin/ForcedUpscaling.exe \
            --title "Forced Upscaling ${GITHUB_REF_NAME#v}" \
            --generate-notes
